name: l4dtoolz

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, '2155']
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lakwsh/hl2sdk-l4d2
          path: hl2sdk-l4d2
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          path: l4dtoolz
          ref: ${{ matrix.branch }}
      - name: Build L4DToolZ
        working-directory: l4dtoolz
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace/l4dtoolz ubuntu:16.04 bash -c "
            dpkg --add-architecture i386 &&
            apt update &&
            apt install -y gcc-5-multilib g++-5-multilib make &&
            make all
          "
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.branch }}
          path: l4dtoolz/Release/l4dtoolz.so
          retention-days: 1
          if-no-files-found: error

  build_windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        branch: [main, '2155']
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lakwsh/hl2sdk-l4d2
          path: hl2sdk-l4d2
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
          path: l4dtoolz
          ref: ${{ matrix.branch }}
      - uses: microsoft/setup-msbuild@v3
      - name: Build hl2sdk
        working-directory: hl2sdk-l4d2
        run: msbuild tier1\tier1-2005.vcxproj /p:Configuration=Release /p:Platform=Win32 -maxcpucount
      - name: Build L4DToolZ
        working-directory: l4dtoolz
        run: msbuild l4dtoolz.vcxproj /p:Configuration=Release /p:Platform=Win32 -maxcpucount
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.branch }}
          path: l4dtoolz/Release/l4dtoolz.dll
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build_linux, build_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: |
            README.md
            README_EN.md
          path: docs-main
      - uses: actions/checkout@v6
        with:
          ref: '2155'
          sparse-checkout: |
            README.md
            README_EN.md
          path: docs-2155
      - name: Package per branch
        run: |
          wget https://oss.lakwsh.net/l4dtoolz.vdf
          for branch in main 2155; do
            mkdir -p pkg/$branch
            cp artifacts/linux-$branch/l4dtoolz.so pkg/$branch/
            cp artifacts/windows-$branch/l4dtoolz.dll pkg/$branch/
            cp l4dtoolz.vdf pkg/$branch/
            cp docs-$branch/README*.md pkg/$branch/
            (cd pkg/$branch && zip -r "$GITHUB_WORKSPACE/l4dtoolz-${{ github.ref_name }}-$branch.zip" .)
          done
      - uses: softprops/action-gh-release@v3
        with:
          files: l4dtoolz-${{ github.ref_name }}-*.zip
          generate_release_notes: true
